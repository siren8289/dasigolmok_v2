name: QA Gate

on:
  push:
    branches: [main, qa/master-973]
  pull_request:

jobs:
  qa-gate:
    name: QA Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install -r data/requirements.txt bandit pytest
      - run: npm ci
        working-directory: front
      - run: python qa/runner/qa_gate.py --scope ci
