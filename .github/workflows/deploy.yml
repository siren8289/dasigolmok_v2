name: CD

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check compose file
        run: docker compose config
      - name: Build images
        run: docker compose build
        env:
          DB_PASSWORD: ci-build-only
